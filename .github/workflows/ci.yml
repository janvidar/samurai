name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.compiler }} ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      # Checked out beside each other rather than into the workspace root: the
      # exotic test framework is looked for next to this checkout, and without it
      # CMake skips the whole suite and the run would pass having tested nothing.
      - uses: actions/checkout@v4
        with:
          path: samurai

      - uses: actions/checkout@v4
        with:
          repository: janvidar/exotic
          path: exotic

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev

      - name: Configure
        run: |
          cmake -S samurai -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Catches an install rule that names a target or a header that moved.
      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

  sanitizers:
    name: Linux ASan/UBSan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: samurai

      - uses: actions/checkout@v4
        with:
          repository: janvidar/exotic
          path: exotic

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev zlib1g-dev libbz2-dev

      # LeakSanitizer stops the world through ptrace, which takes minutes when
      # ptrace_scope is not 0. Ubuntu ships it as 1.
      - name: Allow ptrace
        run: sudo sysctl -w kernel.yama.ptrace_scope=0

      - name: Configure
        run: |
          cmake -S samurai -B build-asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSAMURAI_SANITIZE=ON

      - name: Build
        run: cmake --build build-asan --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  macos:
    name: macOS clang Debug
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          path: samurai

      - uses: actions/checkout@v4
        with:
          repository: janvidar/exotic
          path: exotic

      # macOS ships LibreSSL headers too old for the TLS code, so the Homebrew
      # OpenSSL has to be pointed at explicitly.
      - name: Install dependencies
        run: brew install openssl@3

      - name: Configure
        run: |
          cmake -S samurai -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      # This is the only job that runs the kqueue socket monitor.
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows MSVC Debug
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          path: samurai

      - uses: actions/checkout@v4
        with:
          repository: janvidar/exotic
          path: exotic

      # vcpkg's built packages kept between runs: building OpenSSL takes minutes.
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ runner.os }}-openssl-zlib-bzip2-v1

      - name: Install dependencies
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
        run: |
          mkdir -p "$GITHUB_WORKSPACE/vcpkg-cache"
          choco install -y ninja
          vcpkg install openssl:x64-windows zlib:x64-windows bzip2:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          cmake -S samurai -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        shell: bash
        run: cmake --build build -- -k 0

      # The tests write under /tmp, which Windows reads as \tmp on the current drive.
      - name: Make /tmp
        shell: bash
        run: cmd //c "if not exist \\tmp mkdir \\tmp"

      # Bounded by timeout(1) too: the step's own limit does not reach ctest's children.
      - name: Test
        shell: bash
        timeout-minutes: 15
        run: timeout 600 ctest --test-dir build --output-on-failure --timeout 300
